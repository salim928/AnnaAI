# AnnaAi backend — PEP 517 / uv format
# Install: uv pip install --system -e ".[dev]"
# NOTE: torch must be installed separately with the CPU wheel URL to avoid
# pulling the ~2GB CUDA build:
#   uv pip install torch --index-url https://download.pytorch.org/whl/cpu

[project]
name = "annaai-backend"
version = "0.1.0"
description = "AnnaAi — autonomous AI marketing agent backend"
requires-python = ">=3.12"
readme = "../README.md"

dependencies = [
    # Core
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.20",

    # Database / Supabase
    "supabase>=2.10.0",
    "vecs>=0.4.3",
    "asyncpg>=0.30.0",

    # AI / Agents — CrewAI 1.9 is standalone (no langchain)
    "crewai>=1.9.0",
    "crewai-tools>=0.20.0",
    "anthropic>=0.40.0",
    "sentence-transformers>=3.3.0",

    # Scraping
    "beautifulsoup4>=4.12.0",
    "trafilatura>=2.0.0",
    "httpx>=0.28.0",
    "lxml>=5.0.0",

    # Search (free, no API key)
    "duckduckgo-search>=6.0.0",

    # Encryption / Auth
    "cryptography>=44.0.0",
    "PyJWT>=2.9.0",
    "passlib[bcrypt]>=1.7.4",

    # Email
    "resend>=2.5.0",

    # Google APIs
    "google-analytics-data>=0.18.0",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.0",

    # Task queue
    "celery>=5.4.0",
    "redis>=5.2.0",

    # Image processing
    "Pillow>=11.0.0",

    # Utilities
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "markdown>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
